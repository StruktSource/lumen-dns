# EXAMPLE ONLY. Running this file sends DNS queries to the listed upstream.
schema_version = 1
metrics = "127.0.0.1:9153"

[listen]
udp = ["127.0.0.1:5353", "[::1]:5353"]
tcp = ["127.0.0.1:5353", "[::1]:5353"]

[resolver]
mode = "forward"
dnssec = true
attempts = 2
upstream_timeout_ms = 2000
# Keep private reverse, home.arpa, resolver.arpa, service.arpa, and .local off public upstreams.
local_zones = true
# Optional private CA bundle replaces the public CA roots for all upstreams.
# upstream_ca = "tls/upstream-ca.pem"

[[resolver.providers]]
id = "cloudflare-unfiltered"
protocol = "auto"
encryption = "required"
address_family = "ipv4"
transport_priority = ["quic", "https", "h3", "tls"]

# Custom upstreams can be added next to provider presets (at most 8 addresses in total).
# [[resolver.upstreams]]
# address = "1.1.1.1:853"
# protocol = "tls"
# server_name = "cloudflare-dns.com"
