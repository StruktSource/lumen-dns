# EXAMPLE ONLY. Running this file sends DNS queries to the listed upstream.
schema_version = 1
metrics = "127.0.0.1:9153"

[listen]
udp = ["127.0.0.1:5353", "[::1]:5353"]
tcp = ["127.0.0.1:5353", "[::1]:5353"]

[resolver]
mode = "forward"
dnssec = true
attempts = 2
upstream_timeout_ms = 2000
# Optional private CA bundle replaces the public CA roots for all upstreams.
# upstream_ca = "tls/upstream-ca.pem"

[[resolver.providers]]
id = "cloudflare-unfiltered"
protocol = "tls"
address_family = "ipv4"

# Custom upstreams remain supported, but cannot be mixed with provider presets.
# [[resolver.upstreams]]
# address = "1.1.1.1:853"
# protocol = "tls"
# server_name = "cloudflare-dns.com"
