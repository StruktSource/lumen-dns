# Lumen release defaults: private recursive DNS with DNSSEC, reachable only from this machine.
# Full reference: ../docs/reference/configuration.md
# Console settings (language, query history, accounts, sessions) are saved in the state database,
# not in this file. Change them in the console or with `lumenctl`.
schema_version = 1
# Optional local aggregate metrics. Disabled by default.
# metrics = "127.0.0.1:9153"

# Optional authenticated management API. Requires `lumen --state FILE`.
# Keep loopback-only. Store only a SHA-256 hash of a random 32+ byte token.
# [management]
# listen = "127.0.0.1:9080"
# requests_per_minute = 60
# [[management.tokens]]
# name = "local-admin"
# role = "admin"
# sha256 = "replace-with-64-lowercase-hex-characters"
# [[management.webhooks]]
# id = "home-assistant"
# url = "https://home.example/api/webhook/lumen"
# secret_file = "secrets/home-assistant-webhook.key"

# Web console. It needs `lumen --state FILE`, and HTTP stays on loopback by default.
[web]
http = ["127.0.0.1:8080", "[::1]:8080"]
https = []
max_connections = 64
# Direct HTTPS supports HTTP/1.1 and HTTP/2 with TLS 1.3.
# https = ["127.0.0.1:8443", "[::1]:8443"]
# certificate = "tls/web-cert.pem"
# private_key = "tls/web-key.pem"
# For HTTP/3, keep HTTP loopback/private and use any HTTP/3 reverse proxy.

# DNS listeners. To serve other devices, change both the addresses and allow_clients.
[listen]
udp = ["127.0.0.1:5353", "[::1]:5353"]
tcp = ["127.0.0.1:5353", "[::1]:5353"]
# Encrypted listeners stay off until certificate and private_key are set.
dot = []
doh = []
doq = []
doh3 = []
# Only this host may query Lumen by default.
allow_clients = ["127.0.0.0/8", "::1/128"]
# Optional encrypted listener example. See ../docs/guides/encrypted-dns.md.
# dot = ["127.0.0.1:8853", "[::1]:8853"]
# doh = ["127.0.0.1:8443", "[::1]:8443"]
# doq = ["127.0.0.1:8853", "[::1]:8853"]
# doh3 = ["127.0.0.1:8443", "[::1]:8443"]
# certificate = "tls/cert.pem"
# private_key = "tls/key.pem"

# Built-in iterative recursion with local DNSSEC validation. No provider is used.
# Optional DNSCrypt v2 server (no TLS certificate). Off by default. See docs/guides/encrypted-dns.md.
# [dnscrypt]
# enabled = true
# listen = ["127.0.0.1:5443"]
# provider_name = "2.dnscrypt-cert.dns.home.example"
# key_file = "dnscrypt-provider.key"

# Optional authoritative zones, split-horizon views, conditional forwarding, dynamic updates and
# transfers. Off by default. See docs/guides/authoritative-dns.md.
# [[zones]]
# name = "home.example"
# file = "zones/home.example.zone"
#
# [[forwarders]]
# domain = "corp.example"
# upstreams = ["10.0.0.53:53"]

[resolver]
mode = "recursive"
dnssec = true
# Bounded response, delegation, and validation caches.
cache_entries = 4096
nameserver_cache_entries = 1024
validation_cache_entries = 4096
# Cached data never lives longer than these TTL ceilings.
positive_ttl_secs = 86400
negative_ttl_secs = 3600
# Bound iterative query and nameserver recursion.
recursion_depth = 24
# Bound each full walk. Only a timeout starts the next attempt.
attempts = 2
upstream_timeout_ms = 2000
# Stop registered local-only names here. Extra name-free attempt metrics stay off.
local_zones = true
diagnostics = false
# Optional overrides: BIND-format root hints and DNSKEY-format trust anchors.
# root_hints = "root.hints"
# trust_anchor = "root.key"
# trust_anchor_state = "anchors.state"   # RFC 5011 automatic root key rollover

# Optional RFC 8767 stale answers. Off by default. Expired DNSSEC-authenticated data is not served.
# [resolver.serve_stale]
# enabled = true
# max_age_secs = 86400
# answer_ttl_secs = 30

# Optional persistent response cache. This file contains queried names and answers, not clients.
# [resolver.persistent_cache]
# enabled = true
# path = "dns-cache.sqlite"
# max_entries = 16384
# max_bytes = 67108864
# max_ttl_secs = 604800

# Prime the root and common top-level zones once at startup so the first lookups skip the
# slowest delegation and DNSSEC-key fetches. Queries name only these zones, never clients.
[resolver.warm]
enabled = true
zones = ["com", "net", "org", "info", "de", "uk", "eu", "nl", "fr", "ch", "io", "us"]

# Optional: refresh names that were looked up repeatedly just after their answer expires.
# Names stay in memory only, bounded by max_tracked, and are never logged or exported.
[resolver.prefetch]
enabled = false
min_hits = 2
max_tracked = 1024
max_concurrent = 4
budget_per_minute = 240

# Optional timeout-only fallback. No endpoint is selected or contacted by default.
[resolver.fallback]
enabled = false
# These budgets matter only after fallback is enabled.
recursive_timeout_ms = 7000
timeout_ms = 2000
attempts = 1
# Add an upstream only when enabling fallback. Encrypted protocols need server_name.
# [[resolver.fallback.upstreams]]
# address = "1.1.1.1:853"
# protocol = "tls"
# server_name = "cloudflare-dns.com"
# doh_path = "/dns-query" # HTTPS only; defaults to /dns-query.

# Shared work and network bounds. See ../docs/reference/configuration.md#limits.
[limits]
max_in_flight = 128
max_connections = 64
max_clients = 4096
queries_per_second = 100
# Whole-query deadline, then per-frame and handshake deadline.
query_timeout_ms = 10000
io_timeout_ms = 5000
# Maximum accepted DNS message size.
max_message_bytes = 4096

# Multicast DNS bridge (off by default): answers for .local devices under a domain of yours and
# can repeat mDNS between networks. See docs/guides/mdns.md.
# [mdns]
# enabled = true
# interfaces = ["eth0"]
# domain = "mdns.home.example"

# DHCP server for IPv4 and IPv6 (off by default). A network needs exactly one DHCP server:
# turn your router's off first. See docs/guides/dhcp.md.
# [dhcp]
# enabled = true
# domain = "home.lan"
# lease_file = "dhcp-leases.db"
# [[dhcp.scopes]]
# interface = "eth0"
# subnet = "192.168.1.0/24"
# server_address = "192.168.1.2"
# range_start = "192.168.1.100"
# range_end = "192.168.1.199"
# router = "192.168.1.1"
# IPv6 Router Advertisements (needs root or CAP_NET_RAW). See docs/guides/dhcp.md.
# [[dhcp.router_advertisements]]
# interface = "eth0"
# managed = true
# [[dhcp.router_advertisements.prefixes]]
# prefix = "fd00:1::/64"
# autonomous = false

# Filtering is empty by default. See filtering.example.toml to opt in.

# Automatic certificates (ACME, HTTP-01). Needs port 80 reachable from the internet and the
# [listen] certificate and private_key paths. Off unless domains is set. See
# docs/guides/certificates.md.
# [acme]
# domains = ["dns.example.com"]
# directory = "https://acme-staging-v02.api.letsencrypt.org/directory"
# terms_agreed = true
# account_file = "acme-account.json"
