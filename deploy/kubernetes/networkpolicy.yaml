apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lumen
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: lumen }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        # Keep both the Service port and the pod target port for CNI portability.
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
        - { port: 5353, protocol: UDP }
        - { port: 5353, protocol: TCP }
  egress:
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
        - ipBlock: { cidr: "::/0" }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
        - { port: 853, protocol: TCP }
        - { port: 853, protocol: UDP }
        - { port: 443, protocol: TCP }
