apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumen
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: lumen }
  template:
    metadata:
      labels: { app.kubernetes.io/name: lumen }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: lumen
          image: lumen:ci
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/lumen/lumen.toml"]
          ports:
            - { name: dns-udp, containerPort: 5353, protocol: UDP }
            - { name: dns-tcp, containerPort: 5353, protocol: TCP }
          readinessProbe:
            tcpSocket: { port: dns-tcp }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: dns-tcp }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: "1", memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/lumen, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: lumen }
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
