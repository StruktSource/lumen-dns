{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lumen.fullname" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "lumen.labels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        # Keep both the Service port and the pod target port for CNI portability.
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
        - { port: 5353, protocol: UDP }
        - { port: 5353, protocol: TCP }
  egress:
    - ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
        - { port: 853, protocol: UDP }
        - { port: 853, protocol: TCP }
        - { port: 443, protocol: TCP }
{{- end }}
