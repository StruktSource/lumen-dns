[workspace]
members = [
  "apps/lumen",
  "apps/lumenctl",
  "crates/lumen-api",
  "crates/lumen-core",
  "crates/lumen-proto",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/StruktSource/lumen-dns"
homepage = "https://github.com/StruktSource/lumen-dns"
authors = ["Strukt"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
