[workspace]
members = [
  "apps/lumen",
  "apps/lumenctl",
  "crates/lumen-api",
  "crates/lumen-config",
  "crates/lumen-filter",
  "crates/lumen-core",
  "crates/lumen-proto",
  "crates/lumen-resolver",
  "crates/lumen-store",
  "crates/lumen-web",
]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/StruktSource/lumen-dns"
homepage = "https://github.com/StruktSource/lumen-dns"
authors = ["Strukt"]

[workspace.dependencies]
hickory-proto = { version = "=0.26.3", features = ["dnssec-ring"] }
hickory-server = { version = "=0.26.3", features = ["recursor", "resolver", "dnssec-ring", "tls-ring", "https-ring", "quic-ring", "webpki-roots"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
ipnet = { version = "2", features = ["serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
