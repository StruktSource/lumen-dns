name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  RUST_VERSION: 1.95.0

jobs:
  verify:
    name: Release quality and audit gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component clippy,rustfmt
      - run: ./scripts/dev.sh check
      - run: cargo +${{ env.RUST_VERSION }} install cargo-audit --version 0.22.1 --locked
      - run: cargo +${{ env.RUST_VERSION }} audit
      - run: cargo +${{ env.RUST_VERSION }} audit --file fuzz/Cargo.lock

  test:
    name: Release gate (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64, runner: ubuntu-24.04 }
          - { name: linux-arm64, runner: ubuntu-24.04-arm }
          - { name: macos-arm64, runner: macos-15 }
          - { name: macos-amd64, runner: macos-15-intel }
          - { name: windows-amd64, runner: windows-2025 }
          - { name: windows-arm64-experimental, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
      - run: cargo +${{ env.RUST_VERSION }} test --workspace --locked

  container-test:
    name: Release OCI runtime (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64, runner: ubuntu-24.04 }
          - { name: linux-arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: docker build --tag lumen:release-test .
      - run: test "$(docker run --rm --entrypoint id lumen:release-test -u)" = 65532
      - run: docker run --rm --read-only --tmpfs /tmp lumen:release-test --config /etc/lumen/lumen.toml --check

  kubernetes:
    name: Release Kubernetes smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
      - run: helm lint deploy/helm/lumen
      - run: docker build --tag lumen:ci .
      - run: docker pull python:3.14-alpine
      - run: kind load docker-image lumen:ci python:3.14-alpine --name chart-testing
      - run: kubectl apply -k deploy/kubernetes && kubectl rollout status deployment/lumen --timeout=120s
      - run: kubectl create configmap dns-smoke --from-file=dns-smoke.py=scripts/dns-smoke.py
      - run: kubectl apply -f deploy/kubernetes/smoke-pod.yaml
      - run: kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/dns-smoke --timeout=120s
      - if: failure()
        run: kubectl describe pod dns-smoke
      - if: failure()
        run: kubectl logs deployment/lumen
      - if: always()
        run: kubectl logs dns-smoke

  build:
    name: Archive (${{ matrix.platform }})
    needs: [verify, test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: Linux-X64, runner: ubuntu-24.04 }
          - { platform: Linux-ARM64, runner: ubuntu-24.04-arm }
          - { platform: macOS-ARM64, runner: macos-15 }
          - { platform: macOS-X64, runner: macos-15-intel }
          - { platform: Windows-X64, runner: windows-2025 }
          - { platform: Windows-ARM64, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
      - run: cargo +${{ env.RUST_VERSION }} build --locked --release --package lumen --package lumenctl
      - run: python scripts/package-release.py --platform ${{ matrix.platform }} --version "${{ github.ref_name }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lumen-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

  image:
    name: Publish multi-architecture OCI image
    needs: [verify, test, container-test, kubernetes]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/struktsource/lumen-dns
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

  publish:
    name: Publish GitHub release
    needs: [build, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Verify archives and build checksum manifest
        working-directory: release-artifacts
        run: |
          for checksum in *.sha256; do sha256sum --check "$checksum"; done
          cat *.sha256 > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: release-artifacts/*
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" release-artifacts/* --verify-tag --generate-notes "${flags[@]}"
