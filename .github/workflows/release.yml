name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUST_VERSION: 1.95.0
  IMAGE: ghcr.io/struktsource/lumen-dns

jobs:
  verify:
    name: Release quality and audit gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag and release metadata
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          python scripts/verify-release.py --version "${GITHUB_REF_NAME}"
      - run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component clippy,rustfmt
      - run: ./scripts/dev.sh check
      - run: cargo +${{ env.RUST_VERSION }} install cargo-audit --version 0.22.1 --locked
      - run: cargo +${{ env.RUST_VERSION }} audit
      - run: cargo +${{ env.RUST_VERSION }} audit --file fuzz/Cargo.lock

  create-release:
    name: Open progressive GitHub release
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create or refresh release page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            echo '> **Publishing in progress.** Each tested platform appears here as soon as it is ready.'
            echo
            cat RELEASE_NOTES.md
          } > "${RUNNER_TEMP}/release-notes.md"
          flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then flags+=(--prerelease); fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --title "Lumen ${GITHUB_REF_NAME#v}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md" "${flags[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" --verify-tag \
              --title "Lumen ${GITHUB_REF_NAME#v}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md" "${flags[@]}"
          fi

  package:
    name: Test and publish ${{ matrix.platform }} package
    needs: create-release
    runs-on: ${{ matrix.runner }}
    permissions:
      attestations: write
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: Linux-X64, runner: ubuntu-24.04 }
          - { platform: Linux-ARM64, runner: ubuntu-24.04-arm }
          - { platform: macOS-ARM64, runner: macos-15 }
          - { platform: macOS-X64, runner: macos-15-intel }
          - { platform: Windows-X64, runner: windows-2025 }
          - { platform: Windows-ARM64, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
      - name: Test native workspace
        run: cargo +${{ env.RUST_VERSION }} test --workspace --locked
      - name: Build native release package
        run: cargo +${{ env.RUST_VERSION }} build --locked --release --package lumen --package lumenctl
      - run: python scripts/package-release.py --platform ${{ matrix.platform }} --version "${{ github.ref_name }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: release/*
      - name: Publish package now
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.ref_name }}" release/* --clobber
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lumen-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

  image-platform:
    name: Test and publish OCI ${{ matrix.arch }}
    needs: create-release
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-24.04 }
          - { arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=${{ steps.version.outputs.value }}-${{ matrix.arch }}
      - name: Build native image for runtime checks
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: lumen:release-test
          cache-from: type=gha,scope=lumen-${{ matrix.arch }}
      - name: Verify native image
        run: |
          test "$(docker image inspect --format '{{.Architecture}}' lumen:release-test)" = "${{ matrix.arch }}"
          test "$(docker run --rm --entrypoint id lumen:release-test -u)" = 65532
          docker run --rm --read-only --tmpfs /tmp lumen:release-test \
            --config /etc/lumen/lumen.toml --check
      - name: Publish tested architecture now
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=lumen-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=lumen-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

  kubernetes:
    name: Release Kubernetes smoke
    needs: image-platform
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
      - run: helm lint deploy/helm/lumen
      - name: Load the tested AMD64 image
        run: |
          docker pull "${IMAGE}:${{ steps.version.outputs.value }}-amd64"
          docker tag "${IMAGE}:${{ steps.version.outputs.value }}-amd64" lumen:ci
          docker pull python:3.14-alpine
          kind load docker-image lumen:ci python:3.14-alpine --name chart-testing
      - run: kubectl apply -k deploy/kubernetes && kubectl rollout status deployment/lumen --timeout=120s
      - run: kubectl create configmap dns-smoke --from-file=dns-smoke.py=scripts/dns-smoke.py
      - run: kubectl apply -f deploy/kubernetes/smoke-pod.yaml
      - run: kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/dns-smoke --timeout=120s
      - if: failure()
        run: kubectl get pods,svc,endpoints,networkpolicy -o wide
      - if: failure()
        run: kubectl describe pod dns-smoke
      - if: failure()
        run: kubectl logs deployment/lumen
      - if: always()
        run: kubectl logs dns-smoke

  image-index:
    name: Publish final multi-architecture OCI index
    needs: [image-platform, kubernetes]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Join architecture images
        shell: bash
        run: |
          tags=()
          while IFS= read -r tag; do tags+=(--tag "$tag"); done <<< "${{ steps.meta.outputs.tags }}"
          docker buildx imagetools create "${tags[@]}" \
            "${IMAGE}:${{ steps.version.outputs.value }}-amd64" \
            "${IMAGE}:${{ steps.version.outputs.value }}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${{ steps.version.outputs.value }}" \
            | tee "${RUNNER_TEMP}/image-index.txt"
          grep -q 'linux/amd64' "${RUNNER_TEMP}/image-index.txt"
          grep -q 'linux/arm64' "${RUNNER_TEMP}/image-index.txt"

  finalize-release:
    name: Finalize release manifest
    needs: [package, image-index]
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: lumen-*
          path: release-artifacts
          merge-multiple: true
      - name: Verify packages and build checksum manifest
        working-directory: release-artifacts
        run: |
          test "$(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)" -eq 6
          test "$(find . -maxdepth 1 -type f -name '*.sha256' | wc -l)" -eq 6
          test -z "$(find . -maxdepth 1 -type f ! -name 'lumen-*')"
          for checksum in *.sha256; do sha256sum --check "$checksum"; done
          # Windows-generated .sha256 files use CRLF; normalise so `sha256sum -c` works everywhere.
          cat *.sha256 | tr -d '\r' > SHA256SUMS
          ! grep -q $'\r' SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: release-artifacts/SHA256SUMS
      - name: Complete release page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" release-artifacts/SHA256SUMS --clobber
          assets="$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')"
          test "$(grep -Ec '\.(tar\.gz|zip)$' <<< "$assets")" -eq 6
          test "$(grep -c '\.sha256$' <<< "$assets")" -eq 6
          test "$(grep -c '^SHA256SUMS$' <<< "$assets")" -eq 1
          test -z "$(grep '\.dockerbuild$' <<< "$assets" || true)"
          flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then flags+=(--prerelease); fi
          gh release edit "${GITHUB_REF_NAME}" --title "Lumen ${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTES.md "${flags[@]}"
