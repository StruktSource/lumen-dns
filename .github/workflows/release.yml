name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Build release binary
        run: cargo +1.95.0 build --locked --release --package lumen --package lumenctl
      - name: Package uniquely named binaries and checksums
        run: python scripts/package-release.py --platform ${{ runner.os }}-${{ runner.arch }}
      - name: Upload release binaries
        uses: actions/upload-artifact@v7
        with:
          name: lumen-${{ runner.os }}-${{ runner.arch }}
          path: release/*
          if-no-files-found: error

  publish:
    permissions:
      contents: write
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" release-artifacts/* --generate-notes
